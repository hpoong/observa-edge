services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      # Nginx 로그를 호스트로 내보내서 Filebeat가 읽게 함
      - ./docker-data/nginx/logs:/var/log/nginx
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    depends_on:
      - nginx
    volumes:
      # Filebeat 설정 파일 주입 (읽기 전용)
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Nginx 로그 디렉토리 읽기 (읽기 전용)
      - ./docker-data/nginx/logs:/var/log/nginx:ro
      # Filebeat가 내부적으로 관리하는 읽기 상태 저장소
      - ./docker-data/filebeat/data:/usr/share/filebeat/data
    command: ["--strict.perms=false"]
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./docker-data/elasticsearch/data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    restart: unless-stopped